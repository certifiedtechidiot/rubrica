<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#09090B" flood-opacity="1" />
    </filter>
  </defs>
  
  <!-- Outer Badge / Neo-brutalist square -->
  <rect x="8" y="8" width="80" height="80" rx="16" fill="#FF3366" stroke="#09090B" stroke-width="3" filter="url(#shadow)" />
  
  <!-- Document with folded top-right corner -->
  <path d="M 28 22 L 56 22 L 72 38 L 72 78 L 28 78 Z" fill="#FFFFFF" stroke="#09090B" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Folded corner flap -->
  <path d="M 56 22 L 56 38 L 72 38 Z" fill="#f2eee6" stroke="#09090B" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Exam Paper Text Lines -->
  <line x1="36" y1="44" x2="64" y2="44" stroke="#d4cebe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="36" y1="52" x2="56" y2="52" stroke="#d4cebe" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Verified Evaluation Checkmark -->
  <path d="M 36 67 L 47 77 L 70 52" fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
