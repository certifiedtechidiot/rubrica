name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Build only: nothing in this workflow may write to the repository or publish
# release assets automatically.
permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Project Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build Web Production Assets
        run: |
          bun run build

      - name: Sync Capacitor Android Project
        run: |
          bunx cap sync android

      - name: Ensure Executable Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Restore Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/rubrica-release.keystore
            echo "Release keystore restored from repository secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; the release APK will be unsigned."
          fi

      - name: Build Release APK with Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rubrica-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
